<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0f1419">
<title>汽车仪表盘</title>
<style>
  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
  :root {
    --speed-progress: 0;
    --speed-glow: 0;
    --road-speed: 4s;
    --safe-top: env(safe-area-inset-top, 0px);
    --safe-bottom: env(safe-area-inset-bottom, 0px);
  }
  html, body {
    width: 100%; height: 100%; overflow: hidden;
    background: #0a0d12;
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Helvetica Neue", "Microsoft YaHei", sans-serif;
    color: #f0f4f8;
    user-select: none;
    -webkit-user-select: none;
    -webkit-tap-highlight-color: transparent;
    touch-action: manipulation;
  }

  .app {
    position: fixed; inset: 0;
    z-index: 2;
    display: flex; flex-direction: column;
    padding: calc(var(--safe-top) + 10px) 16px calc(var(--safe-bottom) + 8px);
    overflow: hidden;
  }

  /* 挡风玻璃 / 窗外 */
  .windshield {
    position: absolute; left: 0; right: 0; top: 0; height: 42%;
    border-radius: 0 0 50% 50% / 0 0 18% 18%;
    overflow: hidden;
    pointer-events: none;
    z-index: 0;
    background: linear-gradient(180deg, #1a3a5c 0%, #2d6a9f 35%, #87b8d9 70%, #b8d4e8 100%);
    box-shadow: inset 0 -8px 24px rgba(0,0,0,0.25);
  }
  .windshield::after {
    content: "";
    position: absolute; inset: 0;
    background: linear-gradient(180deg, transparent 50%, rgba(15,20,25,0.85) 100%);
  }
  .road {
    position: absolute; left: 50%; bottom: 0;
    width: 120%; height: 55%;
    transform: translateX(-50%);
    background:
      linear-gradient(90deg, #2d5016 0%, #2d5016 22%, transparent 22%, transparent 78%, #2d5016 78%, #2d5016 100%),
      repeating-linear-gradient(180deg, #3a3f45 0px, #3a3f45 40px, #454b52 40px, #454b52 80px);
    background-size: 100% 100%, 100% 80px;
    animation: roadScroll var(--road-speed) linear infinite;
    opacity: calc(0.35 + var(--speed-glow) * 0.55);
  }
  @keyframes roadScroll {
    from { background-position: 0 0, 0 0; }
    to { background-position: 0 0, 0 80px; }
  }
  .road-line {
    position: absolute; left: 50%; top: 0; bottom: 0; width: 6px;
    margin-left: -3px;
    background: repeating-linear-gradient(180deg, #facc15 0 24px, transparent 24px 48px);
    animation: roadScroll var(--road-speed) linear infinite;
    opacity: 0.9;
  }
  .lines {
    position: absolute; inset: 0; overflow: hidden; pointer-events: none;
    opacity: calc(var(--speed-glow) * 0.85);
  }
  .lines i {
    position: absolute; width: 2px; height: 70px; border-radius: 2px;
    background: linear-gradient(180deg, transparent, rgba(255,255,255,0.7), transparent);
    animation: streak linear infinite;
  }
  @keyframes streak {
    0% { transform: translateY(-100%); }
    100% { transform: translateY(120vh); }
  }

  .dash-panel {
    position: relative; z-index: 2; flex: 1;
    min-height: 0;
    display: flex; flex-direction: column; align-items: center;
    justify-content: center;
    padding-bottom: 4px;
  }

  .mascot {
    font-size: clamp(36px, 10vw, 52px);
    line-height: 1;
    margin-bottom: 4px;
    filter: drop-shadow(0 4px 8px rgba(0,0,0,0.4));
    transition: transform 0.2s ease;
  }
  .mascot.wiggle { animation: wiggle 0.5s ease-in-out infinite; }
  @keyframes wiggle {
    0%, 100% { transform: rotate(-6deg) scale(1); }
    50% { transform: rotate(6deg) scale(1.08); }
  }

  .hint {
    font-size: 15px; font-weight: 700;
    color: rgba(255,255,255,0.75);
    min-height: 22px; margin-bottom: 6px;
    text-align: center;
    text-shadow: 0 1px 4px rgba(0,0,0,0.5);
    transition: color 0.3s;
  }
  .hint.hot { color: #fbbf24; }

  .dial-wrap {
    position: relative;
    width: min(78vw, 300px);
    height: min(78vw, 300px);
    max-height: min(38vh, 300px);
    flex-shrink: 0;
    margin-bottom: 4px;
    overflow: visible;
  }
  .dial {
    display: block;
    width: 100%; height: 100%;
    filter: drop-shadow(0 12px 32px rgba(0,0,0,0.5));
  }
  .dial .track {
    fill: none; stroke: rgba(255,255,255,0.12); stroke-width: 16; stroke-linecap: round;
  }
  .dial .progress {
    fill: none; stroke-width: 16; stroke-linecap: round;
    stroke: url(#speedGradient);
    stroke-dasharray: var(--arc-len);
    stroke-dashoffset: calc(var(--arc-len) * (1 - var(--speed-progress)));
    filter: drop-shadow(0 0 calc(6px + var(--speed-glow) * 12px) rgba(244,63,94,0.6));
  }
  .dial .tick { stroke: rgba(255,255,255,0.45); stroke-width: 2; stroke-linecap: round; }
  .dial .tick-major { stroke: rgba(255,255,255,0.9); stroke-width: 3; }
  .dial .tick-label {
    fill: rgba(255,255,255,0.8); font-size: 10px; font-weight: 700;
    text-anchor: middle; dominant-baseline: middle;
  }
  .dial .needle {
    stroke: #fff; stroke-width: 5; stroke-linecap: round;
    filter: drop-shadow(0 0 6px rgba(255,255,255,0.5));
  }
  .dial .hub { fill: #0f1419; stroke: #fff; stroke-width: 3; }

  .dial-center {
    position: absolute; left: 50%; top: 47%;
    z-index: 4;
    transform: translate(-50%, -50%);
    text-align: center; pointer-events: none; line-height: 1;
    padding: 12px 20px;
    border-radius: 999px;
    background: rgba(10, 14, 20, 0.72);
    box-shadow: 0 4px 20px rgba(0,0,0,0.35);
  }
  .dial-center .num {
    font-size: clamp(48px, 14vw, 76px);
    font-weight: 900;
    font-variant-numeric: tabular-nums;
    letter-spacing: -2px;
    text-shadow: 0 4px 16px rgba(0,0,0,0.45);
    transition: transform 0.15s ease, color 0.3s;
  }
  .dial-center .num.lvl-1 {
    font-size: clamp(40px, 11vw, 62px);
    letter-spacing: -1px;
  }
  .dial-center .num.lvl-2 {
    font-size: clamp(32px, 9vw, 50px);
    letter-spacing: 0;
  }
  .dial-center .num.fast { color: #fbbf24; transform: scale(1.05); }
  .dial-center .num.max { color: #f87171; transform: scale(1.1); }
  .dial-center .unit {
    margin-top: 2px; font-size: 13px; font-weight: 700;
    letter-spacing: 3px; color: rgba(255,255,255,0.55);
  }

  .pedal-bar {
    flex-shrink: 0;
    width: 100%;
    max-width: 400px;
    margin: 0 auto;
    padding-top: 8px;
    z-index: 5;
  }
  .pedals {
    display: flex; gap: 16px; width: 100%;
  }
  .pedal {
    flex: 1;
    min-height: 96px;
    border: none; border-radius: 20px;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 4px;
    font-size: 18px; font-weight: 800;
    color: #fff;
    cursor: pointer;
    touch-action: none;
    transition: transform 0.1s ease, box-shadow 0.15s ease, filter 0.15s;
    box-shadow: 0 8px 0 rgba(0,0,0,0.35), 0 12px 24px rgba(0,0,0,0.3);
  }
  .pedal .icon { font-size: 32px; line-height: 1; }
  .pedal:active, .pedal.pressed {
    transform: translateY(6px);
    box-shadow: 0 2px 0 rgba(0,0,0,0.35), 0 4px 12px rgba(0,0,0,0.25);
  }
  .pedal-brake {
    background: linear-gradient(180deg, #ef4444, #b91c1c);
  }
  .pedal-brake.pressed { filter: brightness(1.15); }
  .pedal-gas {
    background: linear-gradient(180deg, #22c55e, #15803d);
  }
  .pedal-gas.pressed { filter: brightness(1.15); }

  .topbar {
    position: relative; z-index: 3;
    display: flex; justify-content: space-between; align-items: center;
    margin-bottom: 8px;
  }
  .badge {
    background: rgba(255,255,255,0.1);
    border: 1px solid rgba(255,255,255,0.15);
    padding: 6px 12px; border-radius: 999px;
    font-size: 12px; font-weight: 700;
    backdrop-filter: blur(6px);
  }
  .badge b { color: #fbbf24; margin-left: 4px; }
  .mute-btn {
    width: 40px; height: 40px; border-radius: 50%;
    background: rgba(255,255,255,0.1);
    border: 1px solid rgba(255,255,255,0.15);
    font-size: 18px; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
  }

  .stars {
    position: fixed; inset: 0; pointer-events: none; z-index: 10;
    overflow: hidden;
  }
  .stars span {
    position: absolute; font-size: 22px;
    animation: starFly 1.2s ease-out forwards;
    opacity: 0;
  }
  @keyframes starFly {
    0% { opacity: 1; transform: translateY(0) scale(0.5) rotate(0deg); }
    100% { opacity: 0; transform: translateY(-120px) scale(1.2) rotate(180deg); }
  }

  .dash-rim {
    position: fixed; left: 50%; bottom: 0;
    width: 140%; height: 38%;
    transform: translateX(-50%);
    background: radial-gradient(ellipse 80% 100% at 50% 100%, #1a1f28 0%, #0f1419 70%);
    border-radius: 50% 50% 0 0 / 30% 30% 0 0;
    z-index: 0;
    pointer-events: none;
    box-shadow: 0 -4px 20px rgba(0,0,0,0.5);
  }
</style>
</head>
<body>
<div class="windshield" aria-hidden="true">
  <div class="road"><div class="road-line"></div></div>
  <div class="lines" id="lines"></div>
</div>
<div class="dash-rim" aria-hidden="true"></div>

<div class="app">
  <div class="topbar">
    <div class="badge">最高速度 <b id="topSpeed">0</b> km/h</div>
    <button class="mute-btn" id="muteBtn" type="button" aria-label="音效">🔊</button>
  </div>

  <div class="dash-panel">
    <div class="mascot" id="mascot">🚗</div>
    <div class="hint" id="hint">按住右边油门，出发！</div>

    <div class="dial-wrap">
      <svg class="dial" viewBox="0 0 300 300" aria-label="速度表">
        <defs>
          <linearGradient id="speedGradient" x1="0%" y1="100%" x2="100%" y2="0%">
            <stop offset="0%" stop-color="#22C55E"/>
            <stop offset="35%" stop-color="#FACC15"/>
            <stop offset="70%" stop-color="#F97316"/>
            <stop offset="100%" stop-color="#F43F5E"/>
          </linearGradient>
        </defs>
        <g id="dialBody"></g>
        <line class="needle" id="needle" x1="150" y1="165" x2="150" y2="58"/>
        <circle class="hub" cx="150" cy="165" r="11"/>
      </svg>
      <div class="dial-center">
        <div class="num" id="speedNum">0</div>
        <div class="unit">KM/H</div>
      </div>
    </div>

  </div>

  <div class="pedal-bar">
    <div class="pedals">
      <button type="button" class="pedal pedal-brake" id="brakeBtn" aria-label="刹车">
        <span class="icon">🛑</span>
        <span>刹车</span>
      </button>
      <button type="button" class="pedal pedal-gas" id="gasBtn" aria-label="油门">
        <span class="icon">⚡</span>
        <span>油门</span>
      </button>
    </div>
  </div>
</div>

<div class="stars" id="stars" aria-hidden="true"></div>

<script>
(function () {
  var MAX_SPEED = 1500;
  var GAS_RATE = 150;
  var COAST_RATE = 12;
  var BRAKE_RATE = 80;
  var ARC_LEN = 565.486;
  var DIAL_STEPS = 5;
  var DIAL_LABELS = [0, 300, 600, 900, 1200, 1500];

  var $ = function (id) { return document.getElementById(id); };
  var dialBody = $('dialBody');
  var needle = $('needle');
  var speedNum = $('speedNum');
  var hint = $('hint');
  var mascot = $('mascot');
  var topSpeedEl = $('topSpeed');
  var gasBtn = $('gasBtn');
  var brakeBtn = $('brakeBtn');
  var linesEl = $('lines');
  var starsEl = $('stars');
  var muteBtn = $('muteBtn');

  var speed = 0;
  var gasDown = false;
  var brakeDown = false;
  var topSpeed = 0;
  var needleTargetAng = -135;
  var needleCurrentAng = -135;
  var lastTs = 0;
  var soundOn = true;
  var audioReady = false;
  var engineOsc = null;
  var engineGain = null;
  var audioCtx = null;
  var lastStarAt = 0;

  function polar(angleDeg, r) {
    var rad = (angleDeg - 90) * Math.PI / 180;
    return { x: 150 + r * Math.cos(rad), y: 165 + r * Math.sin(rad) };
  }
  function arcPath(r, startDeg, endDeg) {
    var s = polar(startDeg, r), e = polar(endDeg, r);
    var large = (endDeg - startDeg) > 180 ? 1 : 0;
    return 'M ' + s.x + ' ' + s.y + ' A ' + r + ' ' + r + ' 0 ' + large + ' 1 ' + e.x + ' ' + e.y;
  }

  function buildDial() {
    var R = 120, parts = [];
    parts.push('<path class="track" d="' + arcPath(R, -135, 135) + '"/>');
    parts.push('<path class="progress" d="' + arcPath(R, -135, 135) + '" style="--arc-len:' + ARC_LEN + '"/>');
    for (var i = 0; i <= DIAL_STEPS; i++) {
      var deg = -135 + (270 * i / DIAL_STEPS);
      var p1 = polar(deg, R - 2), p2 = polar(deg, R - 22);
      parts.push('<line class="tick tick-major" x1="' + p1.x + '" y1="' + p1.y + '" x2="' + p2.x + '" y2="' + p2.y + '"/>');
      var lp = polar(deg, R - 38);
      parts.push('<text class="tick-label" x="' + lp.x + '" y="' + lp.y + '">' + DIAL_LABELS[i] + '</text>');
    }
    for (var j = 0; j <= DIAL_STEPS * 2; j++) {
      if (j % 2 === 0) continue;
      var d2 = -135 + (270 * j / (DIAL_STEPS * 2));
      var q1 = polar(d2, R - 4), q2 = polar(d2, R - 14);
      parts.push('<line class="tick" x1="' + q1.x + '" y1="' + q1.y + '" x2="' + q2.x + '" y2="' + q2.y + '"/>');
    }
    dialBody.innerHTML = parts.join('');
  }
  buildDial();

  function buildLines() {
    var html = '';
    for (var i = 0; i < 12; i++) {
      var left = (i * 8 + 2) % 100;
      var dur = (0.35 + Math.random() * 0.45).toFixed(2);
      var delay = (Math.random() * 2).toFixed(2);
      var height = (50 + Math.random() * 80).toFixed(0);
      html += '<i style="left:' + left + '%;height:' + height + 'px;animation-duration:' + dur + 's;animation-delay:-' + delay + 's"></i>';
    }
    linesEl.innerHTML = html;
  }
  buildLines();

  function createEngineNodes() {
    if (!audioCtx || engineOsc) return;
    engineGain = audioCtx.createGain();
    engineGain.gain.value = 0;
    engineGain.connect(audioCtx.destination);
    engineOsc = audioCtx.createOscillator();
    engineOsc.type = 'sawtooth';
    engineOsc.frequency.value = 55;
    engineOsc.connect(engineGain);
    engineOsc.start();
  }

  function initAudio() {
    if (!soundOn) return Promise.resolve(false);
    try {
      var Ctx = window.AudioContext || window.webkitAudioContext;
      if (!Ctx) return Promise.resolve(false);
      if (!audioCtx) {
        audioCtx = new Ctx();
      }
      function ready() {
        if (!engineOsc) createEngineNodes();
        audioReady = true;
        return true;
      }
      if (audioCtx.state === 'suspended') {
        var p = audioCtx.resume();
        if (p && typeof p.then === 'function') {
          return p.then(ready).catch(function () { return false; });
        }
        return Promise.resolve(ready());
      }
      return Promise.resolve(ready());
    } catch (e) {
      return Promise.resolve(false);
    }
  }

  function setEngineSound(on, spd) {
    if (!soundOn || !audioReady || !engineGain || !engineOsc) return;
    engineGain.gain.value = on ? 0.15 + (spd / MAX_SPEED) * 0.1 : 0;
    engineOsc.frequency.value = 55 + (spd / MAX_SPEED) * 110;
  }

  function playBrakeSqueak() {
    if (!soundOn) return;
    initAudio().then(function (ok) {
      if (!ok || !audioCtx) return;
      var t = audioCtx.currentTime;
      var osc = audioCtx.createOscillator();
      var g = audioCtx.createGain();
      osc.type = 'square';
      osc.frequency.setValueAtTime(800, t);
      osc.frequency.exponentialRampToValueAtTime(200, t + 0.15);
      g.gain.setValueAtTime(0.12, t);
      g.gain.exponentialRampToValueAtTime(0.001, t + 0.18);
      osc.connect(g);
      g.connect(audioCtx.destination);
      osc.start(t);
      osc.stop(t + 0.2);
    });
  }

  function bindPedal(btn, key) {
    function down(e) {
      e.preventDefault();
      if (key === 'gas') {
        gasDown = true;
        gasBtn.classList.add('pressed');
        initAudio().then(function () { setEngineSound(true, speed); });
      } else {
        brakeDown = true;
        brakeBtn.classList.add('pressed');
        playBrakeSqueak();
      }
    }
    function up() {
      if (key === 'gas') { gasDown = false; gasBtn.classList.remove('pressed'); }
      else { brakeDown = false; brakeBtn.classList.remove('pressed'); }
    }
    btn.addEventListener('pointerdown', down);
    btn.addEventListener('pointerup', up);
    btn.addEventListener('pointerleave', up);
    btn.addEventListener('pointercancel', up);
    btn.addEventListener('contextmenu', function (e) { e.preventDefault(); });
  }
  bindPedal(gasBtn, 'gas');
  bindPedal(brakeBtn, 'brake');

  muteBtn.addEventListener('click', function () {
    soundOn = !soundOn;
    muteBtn.textContent = soundOn ? '🔊' : '🔇';
    if (!soundOn && engineGain) engineGain.gain.value = 0;
  });

  function getHint(spd, g, b) {
    if (b && spd > 5) return '吱——刹住啦！';
    if (g && spd >= MAX_SPEED - 2) return '已经最快啦！🚀';
    if (g && spd < MAX_SPEED - 2) return '踩油门，冲冲冲！';
    if (spd >= 1200) return '飞起来啦！🌟';
    if (spd >= 750) return '呼呼～好快呀！';
    if (spd >= 300) return '继续加油～';
    if (spd > 3 && !g) return '慢慢停下来…';
    if (spd <= 3) return '按住右边油门，出发！';
    return '出发啦！';
  }

  function updateMascot(spd) {
    if (spd >= 1050) {
      mascot.textContent = '🏎️';
      mascot.classList.add('wiggle');
    } else if (spd >= 525) {
      mascot.textContent = '🚙';
      mascot.classList.add('wiggle');
    } else if (spd > 8) {
      mascot.textContent = '🚗';
      mascot.classList.remove('wiggle');
    } else {
      mascot.textContent = '🐢';
      mascot.classList.remove('wiggle');
    }
  }

  function spawnStars() {
    var now = Date.now();
    if (now - lastStarAt < 800) return;
    lastStarAt = now;
    var emojis = ['⭐', '✨', '🌟', '💫'];
    for (var i = 0; i < 6; i++) {
      var s = document.createElement('span');
      s.textContent = emojis[i % emojis.length];
      s.style.left = (20 + Math.random() * 60) + '%';
      s.style.top = (30 + Math.random() * 30) + '%';
      s.style.animationDelay = (Math.random() * 0.2) + 's';
      starsEl.appendChild(s);
      setTimeout(function (el) { el.remove(); }, 1300, s);
    }
  }

  function renderUI() {
    var prog = Math.min(1, speed / MAX_SPEED);
    var glow = prog;
    var disp = Math.round(speed);

    document.documentElement.style.setProperty('--speed-progress', prog.toFixed(3));
    document.documentElement.style.setProperty('--speed-glow', glow.toFixed(3));
    var roadDur = Math.max(0.5, 5 - prog * 4.2);
    document.documentElement.style.setProperty('--road-speed', roadDur.toFixed(2) + 's');

    speedNum.textContent = disp;
    speedNum.classList.toggle('lvl-1', disp >= 100 && disp < 1000);
    speedNum.classList.toggle('lvl-2', disp >= 1000);
    speedNum.classList.toggle('fast', disp >= 750);
    speedNum.classList.toggle('max', disp >= 1200);

    needleTargetAng = -135 + 270 * prog;

    if (disp > topSpeed) {
      topSpeed = disp;
      topSpeedEl.textContent = topSpeed;
      try { localStorage.setItem('car-dashboard-top', String(topSpeed)); } catch (e) {}
    }

    hint.textContent = getHint(speed, gasDown, brakeDown);
    hint.classList.toggle('hot', speed >= 750);
    updateMascot(speed);

    if (speed >= 1200) spawnStars();

    setEngineSound(gasDown && !brakeDown, speed);

    if (navigator.vibrate && brakeDown && speed > 10) {
      try { navigator.vibrate(8); } catch (e) {}
    }
  }

  function physicsStep(dt) {
    if (brakeDown) {
      speed -= BRAKE_RATE * dt;
    } else if (gasDown) {
      speed += GAS_RATE * dt;
    } else {
      speed -= COAST_RATE * dt;
    }
    if (speed < 0) speed = 0;
    if (speed > MAX_SPEED) speed = MAX_SPEED;
  }

  function needleStep() {
    var diff = needleTargetAng - needleCurrentAng;
    if (Math.abs(diff) > 0.05) {
      needleCurrentAng += diff * 0.18;
    } else {
      needleCurrentAng = needleTargetAng;
    }
    needle.setAttribute('transform', 'rotate(' + needleCurrentAng.toFixed(2) + ' 150 165)');
  }

  function loop(ts) {
    if (!lastTs) lastTs = ts;
    var dt = Math.min(0.05, (ts - lastTs) / 1000);
    lastTs = ts;
    physicsStep(dt);
    renderUI();
    needleStep();
    requestAnimationFrame(loop);
  }

  try {
    var saved = localStorage.getItem('car-dashboard-top');
    if (saved) topSpeed = parseInt(saved, 10) || 0;
    topSpeedEl.textContent = topSpeed;
  } catch (e) {}

  document.addEventListener('contextmenu', function (e) { e.preventDefault(); });
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
